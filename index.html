<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta
			http-equiv="X-UA-Compatible"
			content="ie=edge"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="css/main.css"
		/>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>

		<meta
			name="description"
			content="Track workouts, map your routes, and review your progress with Workout Diary."
		/>
		<meta
			name="keywords"
			content="workout diary, fitness tracker, running log, cycling log, HTML, CSS, JavaScript"
		/>
		<meta
			name="author"
			content="George Pavlov"
		/>

		<script
			defer
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<script
			defer
			src="js/main.js"
		></script>

		<title>ATLAS — дневник тренировок на карте</title>
	
<style id="custom-scrollbar">
/* Кастомный скроллбар в палитре проекта */
html{scrollbar-width:thin;scrollbar-color:#D9A441 #0b0b0d}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#0b0b0d}
::-webkit-scrollbar-thumb{background:#D9A441;border-radius:99px;border:2px solid #0b0b0d}
::-webkit-scrollbar-thumb:hover{filter:brightness(.85)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='90'>⛰️</text></svg>">
</head>
	<body>
		<div class="sidebar">
			<h1 class="header header--brand">
      <svg class="brand-mark" viewBox="0 0 34 30" aria-hidden="true">
        <path d="M3 27 L13 6 L19 17 L23 10 L31 27 Z" fill="none" stroke="#D9A441" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="17" cy="24" r="2.6" fill="#D9A441"/>
      </svg>ATLAS</h1>

			<ul class="workouts">
				<form class="hidden form">
					<div class="form__row">
						<label class="form__label">Type</label>
						<select class="form__input form__input--type">
							<option value="running">Running</option>
							<option value="cycling">Cycling</option>
							<option value="skiing">Skiing</option>
							<option value="swimming">Swimming</option>
						</select>
					</div>
					<div class="form__row">
						<label class="form__label">Distance</label>
						<input
							class="form__input form__input--distance"
							placeholder="km"
						/>
					</div>
					<div class="form__row">
						<label class="form__label">Duration</label>
						<input
							class="form__input form__input--duration"
							placeholder="min"
						/>
					</div>
					<div class="form__row">
						<label class="form__label">Cadence</label>
						<input
							class="form__input form__input--cadence"
							placeholder="steps/min"
						/>
					</div>
					<div class="form__row--hidden form__row">
						<label class="form__label">Elevation</label>
						<input
							class="form__input form__input--elevation"
							placeholder="m"
						/>
					</div>
					<button class="form__btn">OK</button>
				</form>
			</ul>
			<button class="reset-btn">Reset Workouts</button>
		</div>

		<div id="map"></div>
	</body>
</html>
